# Builds and tests every change on main and publishes it as the edge tag, to try changes before a
# release. Uses the latest stable T3 Code, like a release; never moves latest or the version tags and
# makes no GitHub release. "Run workflow" rebuilds edge from main.
name: edge

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push waits for the running build instead of cancelling it half-tagged.
concurrency:
  group: edge
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      t3_version: ${{ steps.upstream.outputs.t3_version }}
      edge_version: ${{ steps.upstream.outputs.edge_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: make --no-print-directory upstream | tee -a "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      T3_VERSION: ${{ needs.check.outputs.t3_version }}
      IMAGE_VERSION: ${{ needs.check.outputs.edge_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make build test publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-out-${{ matrix.runner }}
          path: ci-out/

  edge:
    needs: [check, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-out-*
          merge-multiple: true
          path: ci-out
      - run: make edge
        env:
          IMAGE_VERSION: ${{ needs.check.outputs.edge_version }}
