# Turn on auto-merge for pull requests that are ready for review: GitHub squash-merges them once the
# checks the main ruleset requires have passed. Drafts wait until they are marked ready.
name: automerge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    # Fork pull requests get a read-only token; a maintainer merges those.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - run: gh pr merge --auto --squash "$PR" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
